name: Daily Command Center Reminder Push

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder push function
        env:
          CRON_SECRET: ${{ secrets.DCC_CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "Missing repository secret DCC_CRON_SECRET"
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            "https://yqwdxfkjhvoidtwhntsu.supabase.co/functions/v1/send-reminder-push" \
            -H "Content-Type: application/json" \
            -H "x-cron-secret: $CRON_SECRET" \
            -d '{}'
